<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="images/logo.png" >

    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon" href="images/logo.png">
    <title>Takım Girişi</title>

    <style>
        body {
            background: #0b0f1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: #111827;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 350px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border: none;
            border-radius: 8px;
        }

        button {
            padding: 12px 25px;
            background: #00d4ff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Takım Üyesi Girişi</h2>

        <input type="text" id="nameInput" placeholder="İsminizi girin (küçük harflerle sadece ad)">

        <button onclick="checkName()">Giriş Yap</button>
    </div>

    <script>
        function checkName() {

            let name = document.getElementById("nameInput").value.toLowerCase();

            const allowedNames = [
                "abdullah selim",
                "selim",
                "yağız",
                "muammer yağız",
                "yaman",
                "emrah",
                "kaan",
                "aziz kaan",
                "aziz",
                "kerem",
                "yusuf kerem",
            ];

            if (allowedNames.includes(name)) {
                window.location.href = "uye_sayfasi.html";
            } else {
                alert("Bu isim için erişim yetkisi bulunamadı.");
            }
        }
    </script>

</body>
</html>
